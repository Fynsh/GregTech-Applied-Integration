# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ForgeGradle 6 must run on Java 17. If your default `java`/JAVA_HOME is older, launch Gradle with
#   gradlew -Dorg.gradle.java.home="C:\path\to\jdk-17"
# (the compile toolchain is already pinned to Java 17 below via java.toolchain).


## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.10
# The Forge version range can use any version of Forge as bounds or match the loader version range
forge_version_range=[47,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,)
# The mapping channel to use for mappings.
# The default set of supported mapping channels are ["official", "snapshot", "snapshot_nodoc", "stable", "stable_nodoc"].
# Additional mapping channels can be registered through the "channelProviders" extension in a Gradle plugin.
#
# | Channel   | Version              |                                                                                |
# |-----------|----------------------|--------------------------------------------------------------------------------|
# | official  | MCVersion            | Official field/method names from Mojang mapping files                          |
# | parchment | YYYY.MM.DD-MCVersion | Open community-sourced parameter names and javadocs layered on top of official |
#
# You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
# See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
#
# Parchment is an unofficial project maintained by ParchmentMC, separate from Minecraft Forge.
# Additional setup is needed to use their mappings, see https://parchmentmc.org/docs/getting-started
mapping_channel=official
# The mapping version to query from the mapping channel.
# This must match the format required by the mapping channel.
mapping_version=1.20.1


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=gtai
# The human-readable display name for the mod.
mod_name=GregTech - Applied Integration
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=0.0.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.Fynsh.gtai
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Fynsh
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Integrate GregTechModern into AE2.


## Dependency Properties

# Applied Energistics 2 for 1.20.1 (artifact: appeng:appliedenergistics2-forge:<version>)
# Browse available versions at https://modmaven.dev/appeng/appliedenergistics2-forge/
ae2_version=15.4.11
# Version range required by this mod, expanded into META-INF/mods.toml
ae2_version_range=[15.4.11,)

# GuideME is a mandatory runtime dependency of AE2 (in-game guide book library), but it is
# NOT bundled inside the AE2 jar, so the dev runs need it on the runtime classpath as well.
# Browse available versions at https://modrinth.com/mod/guideme/versions?g=1.20.1
guideme_version=20.1.15

# GregTech CEu / GregTech Modern for 1.20.1 (artifact: maven.modrinth:gregtechceu-modern:<version>)
# Browse available versions at https://modrinth.com/mod/gregtechceu-modern/versions?g=1.20.1
gtceu_version=mc1.20.1-7.5.3
# Version range required by this mod, expanded into META-INF/mods.toml
gtceu_version_range=[7.5.3,)

# Jade (WAILA fork) for in-game block/entity inspection during dev runs.
# Runtime only: not a compile dependency and not bundled into the mod jar.
# Browse available versions at https://modrinth.com/mod/jade/versions?g=1.20.1
# The version ID corresponds to 11.13.2+forge.
jade_version=LecuGude

# Just Enough Items for 1.20.1 (artifact: mezz.jei:jei-1.20.1-forge:<version>)
# AE2 requires JEI [15.0.0,16.0.0) and GTCEu requires at least 15.20.0.115.
# NOTE: newer JEI 15.x builds reverted IFluidHelper#getTooltip back to List<Component>, which
# breaks GTCEu 7.5.3's own JEI mixin (it injects into the ITooltipBuilder overload). 15.20.0.x
# still has the ITooltipBuilder signature, so it is the newest JEI that works with GT 7.5.3.
# Browse available versions at https://maven.blamejared.com/mezz/jei/jei-1.20.1-forge/
jei_version=15.20.0.129